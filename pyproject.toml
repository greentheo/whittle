[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "whittle"
version = "0.2.0"
description = "Evolutionary optimization of 3D parts: less material for the same strength, and shapes tuned against a flow."
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Theodore Van Rooy", email = "theodore.vanrooy@gmail.com" }]
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "scikit-image>=0.20",
]

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.4", "mypy>=1.8"]

[project.urls]
Homepage = "https://github.com/greentheo/whittle"

[tool.hatch.build.targets.wheel]
packages = ["src/whittle"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src/whittle"]

# scipy and scikit-image ship no type information. Strict mode stays on for our
# own code; the calls into them are annotated at the call site instead.
[[tool.mypy.overrides]]
module = ["scipy.*", "skimage.*"]
ignore_missing_imports = true
